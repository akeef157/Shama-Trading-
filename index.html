<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shama Trading</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111;
  color:#fff;
}

header{
  display:flex;
  align-items:center;
  padding:15px;
  background:#000;
}

header img{
  width:50px;
  margin-right:10px;
}

.hero{
  padding:30px;
  background:linear-gradient(to right,#000,#222);
}

.hero h1{
  font-size:28px;
}

.btn{
  padding:12px 20px;
  background:orange;
  color:#000;
  text-decoration:none;
  border-radius:8px;
  margin-right:10px;
  display:inline-block;
  font-weight:bold;
}

.cars{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  padding:20px;
}

.card{
  background:#222;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

.card img{
  width:100%;
  border-radius:10px;
}

/* WhatsApp floating button */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  color:white;
  padding:15px;
  border-radius:50%;
  text-decoration:none;
  font-size:20px;
}
</style>

</head>

<body>

<header>
  <img src="logo.jpeg" alt="logo">
  <div>
    <h2>Shama Trading</h2>
    <p>Used Cars & Motorcycles from Japan</p>
  </div>
</header>

<div class="hero">
  <h1>Premium Cars From Japan</h1>
  <p>Trusted exporter. Contact us directly on WhatsApp.</p>

  <a class="btn" href="https://wa.me/818076484545">WhatsApp Now</a>
</div>

<div class="cars">

<div class="card">
  <img src="mercedes_front.jpeg">
  <p>Mercedes Benz</p>
</div>

<div class="card">
  <img src="mercedes_dash.jpeg">
  <p>Interior Dashboard</p>
</div>

<div class="card">
  <img src="mercedes_gear.jpeg">
  <p>Gear System</p>
</div>

<div class="card">
  <img src="mercedes_badge.jpeg">
  <p>Mercedes Logo</p>
</div>

<div class="card">
  <img src="crown.jpeg">
  <p>Toyota Crown</p>
</div>

<div class="card">
  <img src="nsx.jpeg">
  <p>Honda NSX</p>
</div>

</div>

<a class="whatsapp" href="https://wa.me/818076484545">💬</a>

</body>
</html>
